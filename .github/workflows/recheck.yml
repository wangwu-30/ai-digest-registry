name: 每日复检
on:
  schedule:
    - cron: "17 1 * * *"   # 北京时间 09:17
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: recheck, cancel-in-progress: false}
jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python scripts/recheck.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 提交下架记录与检查日志
        run: |
          git config user.name "registry-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curators state
          git diff --cached --quiet || (git commit -m "每日复检 $(date -u +%F)" && git push)
